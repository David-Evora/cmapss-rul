[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmapss-rul"
version = "0.1.0"
description = "Predição de vida útil restante (RUL) de motores turbofan com o dataset NASA C-MAPSS"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
